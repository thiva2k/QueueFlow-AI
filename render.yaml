# Render Blueprint — single source of truth for the QueueFlow backend service.
# Deploy/manage via Render Blueprints so dashboard config can't silently drift.
services:
  - type: web
    name: queueflow-ai-backend
    runtime: python
    rootDir: backend
    # Python version is pinned in backend/.python-version (read by both Render
    # and CI). Do NOT rely on Render's default interpreter: pydantic-core ships
    # no wheel for newer CPython (e.g. 3.14), which forces a Rust source build
    # that fails on Render's read-only Cargo registry. Keep this on a CPython
    # line that has prebuilt wheels (3.12).
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Must include the deployed frontend origin or the browser blocks the API.
      - key: CORS_ORIGINS
        value: https://project-0ppn4.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      # Staff API key for admin/counter endpoints. Set a real secret value in the
      # Render dashboard (sync: false keeps it out of the blueprint/git). When
      # unset, the API runs in open demo mode.
      - key: STAFF_API_KEY
        sync: false
